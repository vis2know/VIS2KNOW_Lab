research_philosophy: >
  My research focuses on developing intelligent visual systems that
  understand complex real-world environments using computer vision,
  machine learning, and multimodal AI. The goal is to bridge fundamental
  AI research with real-world applications such as healthcare,
  intelligent transportation, multimedia analytics, and smart cities.

