<!-- VIS2KNOW top navbar (inline CSS only) -->
<nav class="navbar navbar-default navbar-fixed-top" role="navigation"
     style="margin-bottom:0;border-bottom:1px solid #eaeaea;background:#ffffff;">
  <div class="container-fluid" style="padding-left:15px;padding-right:15px;">

    <!-- Brand + mobile toggler -->
    <div class="navbar-header" style="float:left;">
      <button type="button"
              class="navbar-toggle collapsed"
              data-toggle="collapse"
              data-target="#navbar-collapse-1"
              aria-expanded="false"
              aria-controls="navbar-collapse-1"
              aria-label="Toggle navigation"
              style="border:1px solid #ddd;margin-right:0;">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>

      <!-- Brand with VIS2KNOW logo -->
      <a class="navbar-brand" href="{{ '/' | relative_url }}"
         style="padding:10px 15px;display:inline-flex;align-items:center;gap:8px;line-height:20px;">
        <img src="{{ '/images/vis2know.png' | relative_url }}"
             alt="VIS2KNOW Lab"
             style="height:22px;width:auto;display:inline-block;vertical-align:middle;margin-right:8px;">
        <span style="vertical-align:middle;font-weight:600;letter-spacing:.3px;">VIS2KNOW Lab</span>
      </a>
    </div>

    <!-- Right menu -->
    <div class="collapse navbar-collapse" id="navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right" style="margin-right:0;">

        <li class="{% if page.url == '/' %}active{% endif %}">
          <a href="{{ '/' | relative_url }}"
             {% if page.url == '/' %}aria-current="page"{% endif %}
             style="padding-top:15px;padding-bottom:15px;{% if page.url == '/' %}font-weight:600;background:#f5f5f5;{% endif %}">
            Home
          </a>
        </li>

        <li class="{% if page.url contains '/professor' %}active{% endif %}">
          <a href="{{ '/professor' | relative_url }}"
             {% if page.url contains '/professor' %}aria-current="page"{% endif %}
             style="padding-top:15px;padding-bottom:15px;{% if page.url contains '/professor' %}font-weight:600;background:#f5f5f5;{% endif %}">
            Professor
          </a>
        </li>

        <li class="{% if page.url contains '/team' %}active{% endif %}">
          <a href="{{ '/team' | relative_url }}"
             {% if page.url contains '/team' %}aria-current="page"{% endif %}
             style="padding-top:15px;padding-bottom:15px;{% if page.url contains '/team' %}font-weight:600;background:#f5f5f5;{% endif %}">
            Team
          </a>
        </li>

        <li class="{% if page.url contains '/vacancies' %}active{% endif %}">
          <a href="{{ '/vacancies' | relative_url }}"
             {% if page.url contains '/vacancies' %}aria-current="page"{% endif %}
             style="padding-top:15px;padding-bottom:15px;{% if page.url contains '/vacancies' %}font-weight:600;background:#f5f5f5;{% endif %}">
            Vacancies
          </a>
        </li>

        <li class="{% if page.url contains '/publications' %}active{% endif %}">
          <a href="{{ '/publications' | relative_url }}"
             {% if page.url contains '/publications' %}aria-current="page"{% endif %}
             style="padding-top:15px;padding-bottom:15px;{% if page.url contains '/publications' %}font-weight:600;background:#f5f5f5;{% endif %}">
            Publications
          </a>
        </li>

        <li class="{% if page.url contains '/pictures' %}active{% endif %}">
          <a href="{{ '/pictures' | relative_url }}"
             {% if page.url contains '/pictures' %}aria-current="page"{% endif %}
             style="padding-top:15px;padding-bottom:15px;{% if page.url contains '/pictures' %}font-weight:600;background:#f5f5f5;{% endif %}">
            Pictures
          </a>
        </li>

        <!-- Uncomment to add later:
        <li class="{% if page.url contains '/research' %}active{% endif %}">
          <a href="{{ '/research' | relative_url }}"
             style="padding-top:15px;padding-bottom:15px;{% if page.url contains '/research' %}font-weight:600;background:#f5f5f5;{% endif %}">
            Research
          </a>
        </li>
        -->
      </ul>
    </div>
  </div>
</nav>
