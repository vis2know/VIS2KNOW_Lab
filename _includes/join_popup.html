<!-- Join Lab Popup Modal -->
<div id="joinLabModal" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document" style="max-width: 720px;">
    <div class="modal-content" style="border-radius: 18px; overflow: hidden;">
      <div class="modal-header" style="border-bottom: 0; padding: 14px 18px;">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="font-size: 28px;">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body" style="padding: 0 26px 28px 26px; text-align: center;">
        <!-- Logo (optional) -->
        <img src="{{ '/images/vis2know.png' | relative_url }}" alt="Lab Logo" style="max-height: 120px; width: auto; margin: 8px auto 10px;" />

        <h2 style="margin: 10px 0 6px; font-weight: 700;">Join Our Lab</h2>
        <p style="margin: 0 0 18px; font-size: 16px; line-height: 1.5; color: #444;">
          If you are interested in joining our lab, please fill out the application form.
        </p>

        <a class="btn btn-primary btn-lg"
           href="https://docs.google.com/forms/d/e/1FAIpQLSfUqNUXcdAtaS2cok6ScIds_hkJxN_KarOKsRw2au3WkrXA0g/viewform?usp=publish-editor"
           target="_blank"
           rel="noopener"
           style="border-radius: 999px; padding: 12px 26px; font-weight: 700;">
          Apply Now 🚀
        </a>

        <div style="margin-top: 14px;">
          <label style="font-weight: 400; color: #666;">
            <input type="checkbox" id="dontShowAgain" style="margin-right: 6px;">
            Don’t show again
          </label>
        </div>
      </div>
    </div>
  </div>
</div>
