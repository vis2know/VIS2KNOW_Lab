# Site settings
title: VIS2KNOW Lab
email: ""
description: >-
  VIS2KNOW Lab at Sungkyunkwan University (SKKU). Research in computer vision,
  machine learning, and multimodal perception.
baseurl: "/VIS2KNOW_Lab"
url: "https://vis2know.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Include additional folders/files in the build
include:
  - .htaccess
  - _pages
  - _layouts
  - _data
  - _includes
  - _plugins

# Exclude common non-site files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - .gitignore

sass:
  sass_dir: _sass

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true