# Site settings
title: VIS2KNOW Lab
email: ""
description: >-
  VIS2KNOW Lab at Sungkyunkwan University (SKKU). Research in computer vision,
  machine learning, and multimodal perception.
baseurl: "/VIS2KNOW_Lab"
url: "https://vis2know.github.io"

include:
  - .htaccess
  - _pages
  - _layouts
  - _data
  - _includes
  - _plugins

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
